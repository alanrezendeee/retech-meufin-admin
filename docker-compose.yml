services:
  retechfin-admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retechfin-admin
    ports:
      - "3000:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # Destino do proxy /api/ (meufin-api). host.docker.internal = API rodando no host.
      - API_UPSTREAM=${API_UPSTREAM:-http://host.docker.internal:8002}
    networks:
      - retechfin-network

networks:
  retechfin-network:
    driver: bridge

